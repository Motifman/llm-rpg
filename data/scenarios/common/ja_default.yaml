briefing_headings:
  premises: 世界の前提
  title: "- 舞台のタイトル: {title}"
  overview: "- 概要: {text}"
  world_map: 【この場所の造り】
  deadline: "- 行動の制限: この局面で取りうる自発的な行動（移動・調べる・話す・メモする等）の総量には限りがあり、使い方を誤ると脱出できない可能性がある（現実世界の時計の分秒とは無関係）。今後、クライアントから残り行動量や制限の残りが知らされる場合は、それに従うこと。"
  rules: この世界の決まり
  rule_lines:
    - "- ラベル（接続先・オブジェクト・相手プレイヤー等）は、【現在地と周囲】などに表示されたものだけを使う。"
    - "- 行動は条件を満たさないと拒否されることがある。操作は【現在選べる対象引数】に並んだものの中から選ぶこと。いまできない操作は、【現在選べる対象引数】の「いまできない:」に理由とともに出る。"
    - "- `say_inline` を持つツールでは、その行動をしながら一言を添えられる (任意、200 字以内)。同じ場所の人に届き、隣の場所には話し声がしたことだけが届く。報告・相談・呼びかけ・確認は、発話専用のターンを使わずここに書く方が、時間を無駄にしない。一言には、行動の結果ではなく、これから何をするかを言う。行動は断られることがあり、結果は次の観測で分かる。空なら発話しない。"
    - "- **このシナリオの勝利条件 (最終目的) は、【現在の目的】に記される**。毎ターン参照し、自分の行動がその目的にどう繋がるかを意識すること。その他の活動 (探索・物資収集・調査) は全て最終目的のための手段である。"

