    travel_ticks: 2
    states:
      open: { display_name: 傾いた支柱の下を抜けられる, traversable: true, sound_loss: 0 }
      buried: { display_name: 崩れた岩で埋まっている, traversable: false, sound_loss: 30 }
  rest_machine: { name: 坑夫の詰所と機械室の道, description: 坑夫の詰所から機械室へ続く道。, ends: [miners_rest, machine_room], travel_ticks: 2 }
  tools_timber: { name: 道具置き場と古い支柱の通路の道, description: 道具置き場から古い支柱の通路へ続く道。, ends: [tool_store, timber_passage], travel_ticks: 2 }

item_specs:
  lamp:
    name: カンテラ
    description: 油を足して灯す手提げのカンテラ。
    interactions:
      light_lamp:
        display_label: 油を足して灯す
        precondition:
          has_item: { who: actor, item_spec: lamp_oil, count: 1 }
          failure_text: カンテラに足す油が無い。
        effect:
          sequence:
            steps:
              - take_item: { who: actor, item_spec: lamp_oil, count: 1 }
              - give_item: { who: actor, item_spec: lamp_flame, count: 1 }
        success_text: カンテラに油を足して火を入れた。灯を手に持てば足もとが明るくなる。
        perceived_as:
          witness: { clear: "{actor}がカンテラに火を入れた。" }
          sound: null
          seen_in_dark: true
  fuel_can:
    name: 燃料の缶
    description: 発電機用の燃料が詰まった金属の缶。
  small_fuel_can:
    name: 燃料が少し残った缶
    description: 底に少しだけ燃料が残った金属の缶。
  lift_key:
    name: 昇降機の起動鍵
    description: 鉄でできた太い鍵。昇降機の操作盤の鍵穴に合う。
  lamp_oil:
    name: カンテラの油
    description: カンテラに足す油の小瓶。
  lamp_flame:
    name: カンテラの灯
    description: カンテラに灯した火。手に持っているあいだ辺りを照らす。油が尽きれば消える。
    state_keys:
      burning: { kind: flag, initial: true }
    lights_up: { key: burning, value: true }
    lasts: { ticks: 16, ended_text: カンテラの灯が燃え尽きた。 }
  torch:
    name: たいまつ
    description: 布を巻いて油を染ませた棒。手に持って燃えているあいだは辺りが見える。
    state_keys:
      burning: { kind: flag, initial: true }
    lights_up: { key: burning, value: true }
    lasts: { ticks: 24, ended_text: 火が燃え尽き、手もとには焦げた棒だけが残った。 }
  canary:
    name: カナリアの籠
    description: 小さなカナリアの入った鳥籠。
    interactions:
      watch_canary:
        display_label: カナリアの様子を見る
        precondition: { all_of: [], failure_text: 籠の中がよく見えない。 }
        effect:
          raise_flag: canary_watched
        success_text: 籠の中のカナリアに目を凝らした。
        exertion: does_not_use_body
        perceived_as:
          witness: { clear: "{actor}が鳥籠をのぞき込んでいる。" }
          sound: null
          salience: background
  well_water:
    name: 井戸の水
    description: 井戸から汲んだ冷たい水。
    use:
      sequence:
        steps:
          - take_item: { who: actor, item_spec: well_water, count: 1 }
          - heal: { who: actor, amount: 8 }
  preserved_food:
    name: 保存食
    description: 干した芋と固い餅。
    use:
      sequence:
        steps:
          - take_item: { who: actor, item_spec: preserved_food, count: 1 }
          - satisfy_hunger: { who: actor, amount: 40 }

characters:
  haru:
    appearance: 測量具を背負った年かさの男
    spawn_spot: north_shaft_head
    initial_items: [lamp, fuel_can, lamp_oil, lamp_oil]
    initial_groups: [team_north]
    knows_at_start: [mio]
    being:
      name: ハル
      first_person: 私
      persona: |-
        冬が近い山あいの廃村に来ている。外へ出る峠道は雪で閉ざされた。外へ出る手段は、村の下に広がる古い坑道の奥にある昇降機だけだという。昇降機は一度上がったら二度と下りてこず、籠には三人しか乗れないと聞いている。坑道の中は光が無いと何も見えない。

        あなたはハル、山の測量を請け負う調査隊の隊長で、落ち着いた男。慎重で、確かめてから動く。古い測量日誌を手がかりにしている。

        古い測量日誌には、こうある。中層の分岐の大水門が開いているあいだ、下層の近道は水に浸かって通れない。別の頁には、機械室の排水ポンプで坑道の水を引かせた日のことが、短く書き留めてある。

        話し方: 落ち着いた常体。一人称は「私」。
      objective: ミオと二人そろって、坑道の奥の昇降機で外へ出る。
  mio:
    appearance: 工具袋を腰に下げた若い女の子
    spawn_spot: north_shaft_head
    initial_items: [lamp, lamp_oil, lamp_oil]
    initial_groups: [team_north]
    knows_at_start: [haru]
    being:
      name: ミオ
      first_person: あたし
      persona: |-
        冬が近い山あいの廃村に来ている。外へ出る峠道は雪で閉ざされた。外へ出る手段は、村の下に広がる古い坑道の奥にある昇降機だけだという。昇降機は一度上がったら二度と下りてこず、籠には三人しか乗れないと聞いている。坑道の中は光が無いと何も見えない。

        あなたはミオ、調査隊の若い隊員で、元気な女の子。身軽で、先に行って様子を見るのが得意。機械いじりが好き。

        古い測量日誌には、こうある。中層の分岐の大水門が開いているあいだ、下層の近道は水に浸かって通れない。別の頁には、機械室の排水ポンプで坑道の水を引かせた日のことが、短く書き留めてある。

        話し方: 気さくな常体。一人称は「あたし」。
      objective: ハルと二人そろって、坑道の奥の昇降機で外へ出る。
  gen:
    appearance: 煤けた坑夫の上着を着た初老の男
    spawn_spot: south_adit_mouth
    initial_items: [lamp, lamp_oil, lamp_oil, lamp_oil]
    initial_groups: [team_south]
    knows_at_start: [sayo]
    being:
      name: ゲン
      first_person: 俺
      persona: |-
        冬が近い山あいの廃村に来ている。外へ出る峠道は雪で閉ざされた。外へ出る手段は、村の下に広がる古い坑道の奥にある昇降機だけだという。昇降機は一度上がったら二度と下りてこず、籠には三人しか乗れないと聞いている。坑道の中は光が無いと何も見えない。

        あなたはゲン、この鉱山で働いていた元鉱夫。口数は少ないが、坑道の空気には敏い。家族のサヨと村に戻ってきた。

        働いていた頃に、事務所の金庫の番号は 1907 だと覚えた。昇降機を動かす起動鍵も、その金庫にしまわれていた。

        坑道では、カナリアが鳴きやむのはガスの前兆だと教わった。

        話し方: ぶっきらぼうな常体。一人称は「俺」。
      objective: サヨと二人そろって、坑道の奥の昇降機で外へ出る。
  sayo:
    appearance: 綿入れを着込んだ若い娘
    spawn_spot: south_adit_mouth
    initial_items: [lamp, lamp_oil, lamp_oil, lamp_oil]
    initial_groups: [team_south]
    knows_at_start: [gen]
    being:
      name: サヨ
      first_person: 私
      persona: |-
        冬が近い山あいの廃村に来ている。外へ出る峠道は雪で閉ざされた。外へ出る手段は、村の下に広がる古い坑道の奥にある昇降機だけだという。昇降機は一度上がったら二度と下りてこず、籠には三人しか乗れないと聞いている。坑道の中は光が無いと何も見えない。

        あなたはサヨ、ゲンの娘。子どもの頃に父の職場だった事務所によく出入りしていた。物覚えがよい。

        父から、事務所の金庫の番号は 1907 だと聞いている。昇降機を動かす起動鍵は、その金庫にしまわれていたそうだ。

        坑道では、カナリアが鳴きやむのはガスの前兆だと教わった。

        話し方: はきはきした敬体。一人称は「私」。
      objective: ゲンと二人そろって、坑道の奥の昇降機で外へ出る。

outcomes:
  rescued: { name: 救出, announcement: "{each_person}は昇降機で外へ出た。" }
  stranded: { name: 取り残された, announcement: "{each_person}は坑道に取り残された。" }

person_interactions:
  strike:
    display_label: 殴りかかる
    precondition:
      all_of:
        - not: { is_down: target }
          failure_text: 相手はもう倒れている。
        - ticks_since_last_action_at_least: { who: actor, action: { interaction: strike }, ticks: 3, since: start }
          failure_text: まだ息が整わず、続けて殴りかかれない。
      failure_text: 殴りかかれない。
    effect:
      sequence:
        steps:
          - damage: { who: target, amount: 10 }
          - conditional:
              condition:
                any_of:
                  - is_at_spot: { who: actor, spot: north_shaft_bottom }
                  - is_at_spot: { who: actor, spot: north_tunnel }
                  - is_at_spot: { who: actor, spot: miners_rest }
              then: { raise_flag: noise_north }
              otherwise: no_effect
          - conditional:
              condition:
                any_of:
                  - is_at_spot: { who: actor, spot: south_tunnel }
                  - is_at_spot: { who: actor, spot: south_adit_end }
                  - is_at_spot: { who: actor, spot: tool_store }
              then: { raise_flag: noise_south }
              otherwise: no_effect
          - conditional:
              condition:
                any_of:
                  - is_at_spot: { who: actor, spot: mid_junction }
                  - is_at_spot: { who: actor, spot: machine_room }
                  - is_at_spot: { who: actor, spot: gas_chamber }
                  - is_at_spot: { who: actor, spot: lower_shortcut }
                  - is_at_spot: { who: actor, spot: timber_passage }
                  - is_at_spot: { who: actor, spot: lift_landing }
              then: { raise_flag: noise_deep }
              otherwise: no_effect
    success_text: 拳を振るった。
    perceived_as:
      witness:
        clear: "{actor}が{target}に殴りかかった。"
        dim: 暗がりで、誰かが誰かを殴りつけた。
      target:
        clear: "{actor}があなたに殴りかかった。"
        dim: 暗がりで、誰かに殴りつけられた。
      sound: { loudness: normal, clear: 誰かが誰かを殴りつける鈍い音がした。, muffled: 争うような物音がした。 }
  pickpocket:
    display_label: 荷から何かを抜き取る
    precondition:
      all_of:
        - not: { is_down: target }
          failure_text: 相手は倒れている。
        - not: { is_in_section: { who: target, section: cage } }
          failure_text: 籠の中の相手には手が届かない。
        - ticks_since_last_action_at_least: { who: actor, action: { interaction: pickpocket }, ticks: 3, since: start }
          failure_text: 続けて手を伸ばせば気づかれる。
      failure_text: 荷に手が届かない。
    effect:
      move_item: { from_who: target, to_who: actor, item: random_item_of }
    success_text: 相手の荷から何かを抜き取った。
    allows_stealth: true
    perceived_as:
      witness:
        clear: "{actor}が{target}の荷から何かを抜き取った。"
        dim: 暗がりで、誰かが荷を探るような物音がした。
      target:
        clear: "{actor}があなたの荷から何かを抜き取った。"
        dim: 暗がりで、誰かに荷を探られた。
      sound: { loudness: whisper, clear: 荷を探るような物音がした。, muffled: かすかな物音がした。 }
  loot_from_downed:
    display_label: 倒れている相手の持ち物を奪う
    arguments: { item: item }
    precondition:
      all_of:
        - is_down: target
          failure_text: 相手は動いている。
        - not: { is_in_section: { who: target, section: cage } }
          failure_text: 籠の中の相手には手が届かない。
        - ticks_since_last_action_at_least: { who: actor, action: { interaction: loot_from_downed }, ticks: 3, since: start }
          failure_text: まだ手が離せない。
      failure_text: 持ち物を奪えない。
    effect:
      move_item: { from_who: target, to_who: actor, item: { argument: item, place: anywhere } }
    success_text: 倒れている相手から持ち物を奪った。
    perceived_as:
      witness:
        clear: "{actor}が倒れている{target}の荷を探っている。"
        dim: 暗がりで、誰かが荷を探るような物音がした。
      target:
        clear: "{actor}があなたの荷を探った。"
        dim: 暗がりで、誰かに荷を探られた。
      sound: { loudness: whisper, clear: 荷を探るような物音がした。, muffled: かすかな物音がした。 }

reactions:
  south_entry_floods:
    condition: { flag_is_raised: flooded_south_entry }
    when_becomes_true: { change_passage_state: { passage: stun_sab, state: flooded } }
    when_becomes_false: { change_passage_state: { passage: stun_sab, state: open } }
  north_entry_floods:
    condition: { flag_is_raised: flooded_north_entry }
    when_becomes_true: { change_passage_state: { passage: nsb_ntun, state: flooded } }
    when_becomes_false: { change_passage_state: { passage: nsb_ntun, state: open } }
  shortcut_floods:
    condition: { flag_is_raised: flooded_shortcut }
    when_becomes_true:
      sequence:
        steps:
          - change_passage_state: { passage: junction_shortcut, state: flooded }
          - change_passage_state: { passage: machine_shortcut, state: flooded }
          - change_passage_state: { passage: shortcut_lift, state: flooded }
    when_becomes_false:
      sequence:
        steps:
          - change_passage_state: { passage: junction_shortcut, state: open }
          - change_passage_state: { passage: machine_shortcut, state: open }
          - change_passage_state: { passage: shortcut_lift, state: open }
  fire_door_barred:
    condition:
      any_of:
        - flag_is_raised: fire_door_barred_north
        - flag_is_raised: fire_door_barred_south
    when_becomes_true: { change_passage_state: { passage: fire_door, state: barred } }
    when_becomes_false: { change_passage_state: { passage: fire_door, state: open } }

happenings:
  generator_stops_without_fuel:
    condition:
      all_of:
        - flag_is_raised: generator_running
        - not: { object_count_at_least: { key: generator.fuel, count: 1 } }
    once: false
    effect:
      sequence:
        steps:
          - lower_flag: generator_running
          - lower_flag: generator_warm
          - lower_flag: generator_hum_heard
          - lower_flag: generator_warm_heard
    notice:
      announcement_to: { audience: { where: { all_of: [] } }, text: 地の底から響いていた機械の唸りが、ふっと途切れた。 }

  generator_hum_heard:
    condition:
      all_of:
        - flag_is_raised: generator_running
        - not: { flag_is_raised: generator_hum_heard }
    once: false
    effect: { raise_flag: generator_hum_heard }
    notice:
      announcement_to: { audience: { where: { all_of: [] } }, text: 地の底のほうから、機械の唸りが響いてきた。 }

  generator_warms_up:
    condition:
      all_of:
        - flag_is_raised: generator_running
        - not: { flag_is_raised: generator_warm }
        - ticks_since_last_action_at_least: { who: anyone, action: { interaction: start_generator }, ticks: 6, since: start }
    once: false
    effect: { raise_flag: generator_warm }

  generator_warm_heard_machine_room:
    condition: &generator_warm_not_heard
      all_of:
        - flag_is_raised: generator_warm
        - not: { flag_is_raised: generator_warm_heard }
    once: false
    effect: no_effect
    notice:
      announcement_to:
        audience: { where: { is_at_spot: { who: each_person, spot: machine_room } } }
        text: 発電機の荒い唸りが、低く落ち着いた響きに変わった。
  generator_warm_heard_nearby:
    condition: *generator_warm_not_heard
    once: false
    effect: no_effect
    notice:
      announcement_to:
        audience:
          where:
            any_of:
              - is_at_spot: { who: each_person, spot: mid_junction }
              - is_at_spot: { who: each_person, spot: lower_shortcut }
              - is_at_spot: { who: each_person, spot: miners_rest }
        text: 近くで響いていた機械の荒い唸りが、低く落ち着いた。
  generator_warm_heard_lift_landing:
    condition: *generator_warm_not_heard
    once: false
    effect: no_effect
    notice:
      announcement_to:
        audience: { where: { is_at_spot: { who: each_person, spot: lift_landing } } }
        text: 籠の操作盤の奥で、何かが噛み合うような音がした。
  generator_warm_heard:
    condition: *generator_warm_not_heard
    once: false
    effect: { raise_flag: generator_warm_heard }

  pump_sounds_drained:
    condition:
      all_of:
        - flag_is_raised: pump_pulse
        - any_of:
            - all_of:
                - object_value_is: { key: valve.mark, value: one }
                - flag_is_raised: flooded_south_entry
                - not: { flag_is_raised: gate_a_open }
            - all_of:
                - object_value_is: { key: valve.mark, value: two }
                - flag_is_raised: flooded_shortcut
                - not: { flag_is_raised: gate_c_open }
            - all_of:
                - object_value_is: { key: valve.mark, value: three }
                - flag_is_raised: flooded_north_entry
                - not: { flag_is_raised: gate_b_open }
    once: false
    effect: no_effect
    notice:
      announcement_to:
        audience: &in_machine_room { where: { is_at_spot: { who: each_person, spot: machine_room } } }
        text: 配管の奥で、水が勢いよく吸い上げられていく音がした。やがて音は軽くなった。
  pump_sounds_refilling:
    condition:
      all_of:
        - flag_is_raised: pump_pulse
        - any_of:
            - all_of:
                - object_value_is: { key: valve.mark, value: one }
                - flag_is_raised: flooded_south_entry
                - flag_is_raised: gate_a_open
            - all_of:
                - object_value_is: { key: valve.mark, value: two }
                - flag_is_raised: flooded_shortcut
                - flag_is_raised: gate_c_open
            - all_of:
                - object_value_is: { key: valve.mark, value: three }
                - flag_is_raised: flooded_north_entry
                - flag_is_raised: gate_b_open
    once: false
    effect: no_effect
    notice:
      announcement_to:
        audience: *in_machine_room
        text: 配管の奥で水を吸い上げる音がするが、奥から水の流れ込む音がやまない。
  pump_sounds_dry:
    condition:
      all_of:
        - flag_is_raised: pump_pulse
        - any_of:
            - all_of:
                - object_value_is: { key: valve.mark, value: one }
                - not: { flag_is_raised: flooded_south_entry }
            - all_of:
                - object_value_is: { key: valve.mark, value: two }
                - not: { flag_is_raised: flooded_shortcut }
            - all_of:
                - object_value_is: { key: valve.mark, value: three }
                - not: { flag_is_raised: flooded_north_entry }
    once: false
    effect: no_effect
    notice:
      announcement_to:
        audience: *in_machine_room
        text: 配管が空気を吸う音がするばかりで、水の音はしない。
  pump_drains:
    condition: { flag_is_raised: pump_pulse }
    once: false
    effect:
      sequence:
        steps:
          - lower_flag: pump_pulse
          - conditional:
              condition:
                all_of:
                  - object_value_is: { key: valve.mark, value: one }
                  - not: { flag_is_raised: gate_a_open }
              then: { lower_flag: flooded_south_entry }
              otherwise: no_effect
          - conditional:
              condition:
                all_of:
                  - object_value_is: { key: valve.mark, value: two }
                  - not: { flag_is_raised: gate_c_open }
              then: { lower_flag: flooded_shortcut }
              otherwise: no_effect
          - conditional:
              condition:
                all_of:
                  - object_value_is: { key: valve.mark, value: three }
                  - not: { flag_is_raised: gate_b_open }
              then: { lower_flag: flooded_north_entry }
              otherwise: no_effect

  gate_a_keeps_flooding:
    condition:
      all_of:
        - flag_is_raised: gate_a_open
        - not: { flag_is_raised: flooded_south_entry }
    once: false
    effect: { raise_flag: flooded_south_entry }
  gate_a_water_drains:
    condition: &south_entry_draining
      all_of:
        - not: { flag_is_raised: gate_a_open }
        - flag_is_raised: flooded_south_entry
    once: false
    effect: { add_to_object_count: { key: gate_a.ticks_since_closed, amount: 1 } }
  gate_a_water_recedes:
    condition:
      all_of:
        - *south_entry_draining
        - object_count_at_least: { key: gate_a.ticks_since_closed, count: 12 }
