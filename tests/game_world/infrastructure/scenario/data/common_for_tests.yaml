    clear_from: 50
    muffled_from: 35
    faint_from: 20
    attentive_allowance: 15
  stealth:
    notice_by_bystander: { sees_clearly: 0.4, sees_shapes: 0.15, sees_nothing: 0.0 }
    notice_by_target: { sees_clearly: 0.6, sees_shapes: 0.3, sees_nothing: 0.0 }
    attentive_bonus: 0.2
    duration_multiplier: 2.0
  action_durations:
    listen: 1
    tend: 3
    hand_over: 1
    pick_up: 1
    drop: 1
    search: 3
    use_item: 2
    enter_section: 1
    leave_section: 1
    hold: 1
    put_away: 1
    cast_ballot: 1
    interact_with_object: 2
    interact_with_carried_item: 2
    interact_with_person: 2
  person_max_hp: 100
  pack_capacity: 20

refusal_texts:
  common_rules:
    actor_cannot_act: 今は体が動かない。
    busy: 手が離せない。
    not_together: そこには届かない。
    out_of_reach: 手が届かない。
    too_tired: 疲れて動けない。
    not_allowed_in_this_stage: 今はできない。
    no_one_found_in_the_dark: 暗くて誰も見つからない。
    not_carrying: それを持っていない。
  world_state: {}
  hidden: 今はできない。
  unlisted: うまくいかなかった。

# 区画の出入りと操作の done は、作者が区画 (enter_text / leave_text) と操作 (success_text) に書く。
action_texts:
  travel:
    summary: 「{origin}」から「{destination}」へ向かって出発した
    done: 「{destination}」へ移動中。到着までは他の行動はできない。
  arrival:
    summary: 「{destination}」に着いた
    done: 「{destination}」に到着した。ここから次の行動を選べる。
  whisper:
    summary: "「{target}」に囁いた: 「{speech}」"
    done: 「{speech}」とささやいた。
  speak:
    summary: "あなたは言った: 「{speech}」"
    done: 「{speech}」と言った。
  shout:
    summary: "あなたは叫んだ: 「{speech}」"
    done: 「{speech}」と叫んだ。
  listen:
    summary: 耳を澄ました
    done: 耳を澄まし、周囲の音や人の気配を確かめた。
  wait:
    summary: その場で待機した
    done: しばらく行動を控えて、様子を見た
  tend:
    summary: 「{target}」を介抱した
    done: "{target}を介抱した。"
  hand_over:
    summary: 「{target}」に「{item}」を渡した
    done: "{item}を{target}に渡した。"
  pick_up:
    summary: 「{item}」を拾った
    done: "{item}を拾い上げた。"
  drop:
    summary: 「{item}」を地面に置いた
    done: "{item}を地面に置いた。"
  search:
    summary: この場所を探索した
    done: 辺りを探した。
  use_item:
    summary: 「{item}」を使った
    done: "{item}を使った。"
  hold:
    summary: 「{item}」を手に持った
    done: "{item}を手に持った。"
  put_away:
    summary: 「{item}」をしまった
    done: "{item}をしまった。"
  cast_ballot:
    summary: 投票した
    done: 投票した。
  vote_for:
    summary: 「{target}」へ投票した
    done: 投票した。
  enter_section:
    summary: "{section}へ位置を移した"
  leave_section:
    summary: 「{section}」から出た
  interact_with_object:
    summary: 「{object}」で{how}
  interact_with_carried_item:
    summary: 「{item}」で{how}
  interact_with_person:
    summary: 「{target}」に対して{how}
  interact_with_someone_in_the_dark:
    summary: 暗がりで誰かに対して{how}

