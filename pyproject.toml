[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rpg-world"
version = "0.1.0"
description = "AI RPG World Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "coverage==7.9.2",
    "exceptiongroup==1.3.0",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "iniconfig==2.1.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "pytest-xdist==3.6.1",
    "PyYAML==6.0.1",
    "tomli==2.2.1",
    "typing_extensions==4.14.1",
    "litellm==1.83.0",
    "pydantic==2.8.2",
    "python-dotenv==1.0.1",
    "anyio>=4.0",
    "uvicorn[standard]==0.30.6",
    "semantic-resolver",
]

[project.optional-dependencies]
export = [
    "datasets>=5.0.0",
    "pyarrow>=25.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
semantic-resolver = { git = "https://github.com/Motifman/semantic-resolver.git", rev = "f164e0973c0cb6aa59aaa75837107f2a962b4d08" }
