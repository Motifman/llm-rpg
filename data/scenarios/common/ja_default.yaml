  travel:
    summary: 「{origin}」から「{destination}」へ向かって出発した
    done: 「{destination}」へ移動中。到着までは他の行動はできない。
    ongoing: 「{destination}」へ向かっている
  arrival:
    summary: 「{destination}」に着いた
    done: 「{destination}」に到着した。ここから次の行動を選べる。
  whisper:
    summary: "「{target}」に囁いた: 「{speech}」"
    done: 「{speech}」とささやいた。
