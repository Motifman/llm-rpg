name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 1 台では収集と重い試験の偏りで約 6.8 分かかっていた (2026-10-19、#1652)。
    # .test_durations の時間で 3 組に分け、組ごとの所要時間をそろえる。
    # 1 組が落ちても残りの組の結果を見られるよう、fail-fast は切る。
    name: test (${{ matrix.group }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pyproject.toml の対応下限。下限で通らない退行は上位版だけでは拾えない。
          python-version: "3.10"

      - name: Install uv
        # setup-uv は uv 本体を配布元から取りに行き、そこで時間切れになって
        # job が止まったり 3 分待たされたりした (design_decisions D1652)。
        # PyPI から入れる。版は全 job で同じものに固定する。
        run: python -m pip install uv==0.11.28

      - name: Install locked dependencies
        run: uv sync --locked --extra export

      - name: Run tests
        # -n auto は runner の実コア数へ合わせる。数値を固定すると runner の
        # 種類が変わったときに余らせるか、逆に取り合って遅くなる。
        #
        # 手元の既定 (pytest.ini) には入れない。1 件だけ流したいときに
        # 邪魔になり、失敗時の出力も worker 単位に散って読みにくくなる。
        #
        # worksteal は、重い試験が 1 つの worker に積み重なったとき、空いた
        # worker が残りを引き取る。既定の load では重い 2 本が同じ worker に
        # 順に並び、ほかの worker が先に手を空けていた。
        run: uv run --frozen pytest -n auto --dist=worksteal --splits 3 --group "${{ matrix.group }}"

  lint:
    # ruff の静的検査。テストとは別 job にして、落ちたときに「テストが壊れた」
    # のか「静的検査に引っかかった」のかを job 名で読めるようにする。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run --frozen ruff check src tests scripts

      - name: Check ruff format
        run: uv run --frozen ruff format --check src tests scripts

  typecheck:
    # mypy の型検査。ruff とは別 job にする。静的検査の中でも、型の不整合と
    # 書き方の違反は原因も直し方も違うので、job 名で切り分けられるようにする。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run --frozen mypy

  secret-leak:
    # テストロジックではなく、checkout されたリポジトリ自体に内部ホスト名や
    # private IP が混ざっていないかを見る gate。独立 job にして、失敗理由を
    # job 名から読めるようにする。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for internal hostnames
        run: bash scripts/check_no_internal_hostnames.sh

  quality-goldens:
    # 質感 golden (docs/quality_checks/) が現行コードで再生成したものと
    # 一致するかを見る。**通常のテストとは別 job にする。** 落ちたときに
    # 「テストが壊れた」のか「golden の更新を忘れた」のかが job 名で読める。
    #
    # python は通常試験と同じ対応下限だけ。golden の中身は python
    # バージョンに依存しないので、マトリクスにする理由が無い。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Install locked dependencies
        run: uv sync --locked --extra export

      - name: Regenerate quality goldens
        # ここは -n を付けない。golden は同じファイルへ書き出すものがあり、
        # 並列にすると書き込み順で中身が変わって差分検査が不安定になる。
        # 1 分かからず、通常試験と並列に走るので短縮の必要もない。
        run: uv run --frozen pytest -m quality

      - name: Fail if the goldens changed
        # 検査対象はリポジトリ全体。CI は毎回まっさらな checkout から
        # 始まるので、ここでの差分は「quality 実行が変えたものすべて」と
        # 一意に定まる。golden の鮮度だけでなく「-m quality は commit 済み
        # 状態から何も変えない」という冪等性そのものを守る。
        run: |
          if ! git diff --exit-code; then
            echo "::error::質感 golden が現行コードと食い違っています。手元で 'uv run pytest -m quality' を回し、docs/quality_checks/ の変更を commit してください。"
            exit 1
          fi

      - name: Fail if new files appeared
        # git diff は追跡外のファイルを見ない。golden の追加し忘れや生成先の
        # 間違い (新しいファイルが生まれる形の事故) はこちらで捕まえる。
        run: |
          untracked="$(git status --porcelain)"
          if [ -n "$untracked" ]; then
            echo "::error::-m quality の実行で追跡されていないファイルが生まれました。生成先が正しいか確認し、必要なら commit してください。"
            echo "$untracked"
            exit 1
          fi
