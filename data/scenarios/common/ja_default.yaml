  item_joiner: と
  travel:
    witness:
      clear: "{actor}が〈{passage}〉を抜けて「{destination}」へ去っていった。"
      dim: "{actor}がどこかへ去っていった。"
    sound: { loudness: whisper, clear: 足音が遠ざかっていった。, muffled: かすかな足音がした。 }
  arrival:
    witness:
      clear: "{actor}が「{origin}」から〈{passage}〉を通って{destination}にやってきた。"
      dim: "{actor}がどこからかやって来た。"
    sound: { loudness: whisper, clear: 足音が近づいてきた。, muffled: かすかな足音がした。 }
  whisper:
    witness: { clear: "{actor}が{target}に何かささやいた。" }
    target: { clear: "{actor}があなたに顔を寄せた。" }
    sound: { loudness: whisper, clear: "{actor}が「{speech}」とささやいた。", muffled: 誰かがささやく声がした。 }
    salience: background
  speak:
    witness: { clear: "{actor}が何か話している。" }
    sound: { loudness: normal, clear: "{actor}が「{speech}」と言った。", muffled: 誰かの話し声がした。 }
    salience: background
  shout:
    witness: { clear: "{actor}が叫んでいる。" }
    sound: { loudness: very_loud, clear: "{actor}が「{speech}」と叫んだ。", muffled: 遠くで誰かの叫び声がした。 }
    salience: notable
  listen:
    witness: { clear: "{actor}が耳を澄ましている。" }
    sound: null
    salience: background
  wait:
    witness: { clear: "{actor}はじっとしている。" }
    sound: null
    salience: background
  tend:
    witness: { clear: "{actor}が{target}を介抱している。" }
    target: { noticed_later: "{actor}が介抱してくれたようだ。" }
    sound: null
  hand_over:
    witness: { clear: "{actor}が{item}を{target}に渡した。" }
    target: { clear: "{actor}があなたに{item}を渡した。" }
    sound: null
  pick_up:
    witness: { clear: "{actor}が{item}を拾い上げた。" }
    sound: null
  drop:
    witness: { clear: "{actor}が{item}を地面に置いた。" }
    sound: { loudness: whisper, clear: 何かを置く音がした。, muffled: かすかな物音がした。 }
  search:
    witness: { clear: "{actor}が辺りを探っている。" }
    sound: { loudness: whisper, clear: 何かを探る物音がした。, muffled: かすかな物音がした。 }
  use_item:
    witness: { clear: "{actor}が{item}を使った。" }
    sound: null
  hold:
