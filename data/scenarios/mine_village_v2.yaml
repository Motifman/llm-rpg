    condition: { flag_is_raised: canary_watched }
    once: false
    effect: { lower_flag: canary_watched }

  lift_leaves:
    condition: { flag_is_raised: lift_departed }
    once: true
    effect:
      sequence:
        steps:
          - for_everyone:
              people:
                where:
                  all_of:
                    - is_in_section: { who: each_person, section: cage }
                    - not: { outcome_is: { who: each_person, outcome: died } }
              effect: { set_outcome: { who: each_person, outcome: rescued } }
          - for_everyone:
              people:
                where:
                  all_of:
                    - not: { is_in_section: { who: each_person, section: cage } }
                    - not: { outcome_is: { who: each_person, outcome: died } }
              effect: { set_outcome: { who: each_person, outcome: stranded } }

ending:
  ends_when: all_outcomes_decided
