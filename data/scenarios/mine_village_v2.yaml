    condition: { flag_is_raised: safe_opened }
    once: true
    effect: no_effect
    notice:
      announcement_to: { audience: { where: { all_of: [] } }, text: 村のほうで、鐘が大きく鳴り響いた。 }

  gas_seeps_in:
    condition:
      all_of:
        - not: { flag_is_raised: gas_present }
        - chance: 0.08
    once: false
    effect: { raise_flag: gas_present }
  gas_clears:
    condition:
      all_of:
        - flag_is_raised: gas_present
        - ticks_since_happening_at_least: { happening: gas_seeps_in, ticks: 8 }
    once: false
    effect: { lower_flag: gas_present }

  canary_falls_silent:
    condition:
      all_of:
        - flag_is_raised: canary_watched
        - flag_is_raised: gas_present
    once: false
    effect: no_effect
    notice:
      announcement_to:
        audience: &holding_canary { where: { has_item: { who: each_person, item_spec: canary, count: 1 } } }
        text: カナリアは鳴きやんで、籠の底でじっとしている。
  canary_keeps_singing:
    condition:
      all_of:
        - flag_is_raised: canary_watched
        - not: { flag_is_raised: gas_present }
    once: false
    effect: no_effect
    notice:
      announcement_to: { audience: *holding_canary, text: カナリアは小さくさえずっている。 }
