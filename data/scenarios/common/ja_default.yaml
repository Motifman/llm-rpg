rules:
  tend: { revive_hp_rate: 0.6 }
  fatigue:
    per_exertion: 2
    limit: 100
    levels:
      - { starts_at: 0, name: 元気 }
      - { starts_at: 30, name: 少し疲れている }
      - { starts_at: 60, name: 疲れている, seen_as: 疲れている }
      - { starts_at: 85, name: ぐったりしている, seen_as: ぐったりしている }
      - { starts_at: 100, name: 疲れ切って動けない, seen_as: 限界。動けず座り込んでいる }
  hunger:
    per_tick: 1
    limit: 100
    starvation_damage: null
    levels:
      - { starts_at: 0, name: 空腹ではない }
      - { starts_at: 20, name: 少し空腹 }
      - { starts_at: 40, name: やや空腹 }
      - { starts_at: 60, name: 空腹 }
      - { starts_at: 80, name: ひどく空腹 }
  death: { grace: 30 }
  departed_persons_act: false
  name_tags: false
  hearing:
    loudness: { whisper: 30, normal: 60, loud: 75, very_loud: 90 }
    loss_per_passage: 15
    clear_from: 50
    muffled_from: 35
    faint_from: 20
    attentive_allowance: 15
  stealth:
    notice_by_bystander: { sees_clearly: 0.4, sees_shapes: 0.15, sees_nothing: 0.0 }
    notice_by_target: { sees_clearly: 0.6, sees_shapes: 0.3, sees_nothing: 0.0 }
    attentive_bonus: 0.2
    duration_multiplier: 2.0
  action_durations:
    listen: 1
    tend: 3
    hand_over: 1
    pick_up: 1
    drop: 1
    search: 3
    use_item: 2
    enter_section: 1
    leave_section: 1
    hold: 1
    put_away: 1
    cast_ballot: 1
    interact_with_object: 2
    interact_with_carried_item: 2
    interact_with_person: 2
  person_max_hp: 100
  pack_capacity: 20

refusal_texts:
  common_rules:
    actor_cannot_act: 今は体が動かない。
    busy: 手が離せない。今していることが済むまで待つしかない。
    not_together: ここには見当たらない。
    out_of_reach: ここからでは手が届かない。
    too_tired: 疲れ切っていて、体が言うことを聞かない。
    not_allowed_in_this_stage: 今はそれをするときではない。
    no_one_found_in_the_dark: 暗がりを探ったが、誰にも触れなかった。
    not_carrying: それを持っていない。
  world_state:
    GAME_WORLD.GROUND_ITEM_NOT_FOUND: それはもう、そこには無かった。
    GAME_WORLD.ITEM_ALREADY_LEFT_WORLD: それはもう無くなっていた。
    GAME_WORLD.ITEM_NOT_CARRIED: それを持っていない。
    GAME_WORLD.ITEM_NOT_USABLE: それは使いようがない。
    GAME_WORLD.INVENTORY_FULL: 荷がいっぱいで、これ以上は持てない。
    GAME_WORLD.NOT_ENOUGH_ITEMS_OF_SPEC: 足りるだけの数を持っていない。
    GAME_WORLD.PACK_IS_EMPTY: 荷には何も入っていない。
    GAME_WORLD.ITEM_NOT_HELD: それを手に持っていない。
    GAME_WORLD.ITEM_ALREADY_HELD: もう手に持っている。
    GAME_WORLD.ITEM_NOT_PACKED: それは荷にしまっていない。
    GAME_WORLD.NOT_ENOUGH_STOCK: もう残っていない。
    GAME_WORLD.NOT_ENOUGH_COUNT: もう数が足りない。
    GAME_WORLD.INSUFFICIENT_GOLD: 金が足りない。
    GAME_WORLD.PERSON_NOT_ALIVE: その人は倒れているか、もう息をしていない。
    GAME_WORLD.PERSON_NOT_DOWN: 相手は倒れていない。
    GAME_WORLD.OUTCOME_ALREADY_DECIDED: その人の行く末は、もう決まっている。
    GAME_WORLD.ALREADY_IN_GROUP: もうその集まりに入っている。
    GAME_WORLD.ALREADY_IN_ANOTHER_GROUP_OF_GROUPING: もう別の集まりに入っている。
    GAME_WORLD.NOT_IN_GROUP: その集まりには入っていない。
    GAME_WORLD.WHEREABOUTS.SECTION_FULL: もう入る余地がない。
    GAME_WORLD.WHEREABOUTS.OCCUPANT_ALREADY_IN_SECTION: もう中にいる。
    GAME_WORLD.WHEREABOUTS.OCCUPANT_NOT_IN_SECTION: 中にはいない。
    GAME_WORLD.WHEREABOUTS.OCCUPANT_NOT_AT_SECTION_SPOT: そこはこの場所には無い。
    GAME_WORLD.WHEREABOUTS.OCCUPANT_NOT_PLACED: その人はもうここにはいない。
    GAME_WORLD.WHEREABOUTS.PASSAGE_ALREADY_REMOVED: その道はもう無い。
    GAME_WORLD.WORLD_ALREADY_ENDED: 世界はもう終わった。
    GAME_WORLD.GROUP_DECISION_NOT_OPEN: 今は決めるときではない。
    GAME_WORLD.GROUP_DECISION_ALREADY_OPEN: もう決めているところだ。
    GAME_WORLD.NO_VOTERS_GIVEN: 票を入れられる人がいない。
    GAME_WORLD.NO_CHOICES_GIVEN: 選べる人がいない。
    GAME_WORLD.VOTER_NOT_IN_DECISION: この決めごとに加わっていない。
    GAME_WORLD.CHOICE_NOT_IN_DECISION: その人は選べない。
    GAME_WORLD.BALLOT_ALREADY_CAST: もう票を入れた。
    GAME_WORLD.ABSTAIN_NOT_ALLOWED: 票を入れずに済ませることはできない。
    GAME_WORLD.WHEREABOUTS.NO_ROUTE: そこへ行く道が見当たらない。
    GAME_WORLD.WHEREABOUTS.OCCUPANT_NOT_AT_ROUTE_START: 今は道の途中だ。
  hidden: 今はできない。
  unlisted: うまくいかなかった。

# 区画の出入りと操作の done は、作者が区画 (enter_text / leave_text) と操作 (success_text) に書く。
action_texts:
  travel:
    summary: 「{origin}」から「{destination}」へ向かって出発した
    done: 「{destination}」へ移動中。到着までは他の行動はできない。
  arrival:
    summary: 「{destination}」に着いた
    done: 「{destination}」に到着した。ここから次の行動を選べる。
  whisper:
    summary: "「{target}」に囁いた: 「{speech}」"
    done: 「{speech}」とささやいた。
  speak:
    summary: "あなたは言った: 「{speech}」"
    done: 「{speech}」と言った。
  shout:
    summary: "あなたは叫んだ: 「{speech}」"
    done: 「{speech}」と叫んだ。
  listen:
    summary: 耳を澄ました
    done: 耳を澄まし、周囲の音や人の気配を確かめた。
  wait:
    summary: その場で待機した
    done: しばらく行動を控えて、様子を見た
  tend:
    summary: 「{target}」を介抱した
    done: "{target}を介抱した。"
  hand_over:
    summary: 「{target}」に「{item}」を渡した
    done: "{item}を{target}に渡した。"
  pick_up:
    summary: 「{item}」を拾った
    done: "{item}を拾い上げた。"
  drop:
    summary: 「{item}」を地面に置いた
    done: "{item}を地面に置いた。"
  search:
    summary: この場所を探索した
    done: 辺りを探した。
  use_item:
    summary: 「{item}」を使った
    done: "{item}を使った。"
  hold:
    summary: 「{item}」を手に持った
    done: "{item}を手に持った。"
  put_away:
    summary: 「{item}」をしまった
    done: "{item}をしまった。"
  cast_ballot:
    summary: 投票した
    done: 投票した。
  vote_for:
    summary: 「{target}」へ投票した
    done: 投票した。
  enter_section:
    summary: "{section}へ位置を移した"
  leave_section:
    summary: 「{section}」から出た
  interact_with_object:
    summary: 「{object}」で{how}
  interact_with_carried_item:
    summary: 「{item}」で{how}
  interact_with_person:
    summary: 「{target}」に対して{how}
  interact_with_someone_in_the_dark:
    summary: 暗がりで誰かに対して{how}

built_in_action_perceptions:
  item_joiner: と
  travel:
    witness:
      clear: "{actor}が{destination}へ去っていった。"
      dim: "{actor}がどこかへ去っていった。"
    sound: { loudness: whisper, clear: 足音が遠ざかっていった。, muffled: かすかな足音がした。 }
  arrival:
    witness:
      clear: "{actor}が{origin}からやって来た。"
      dim: "{actor}がどこからかやって来た。"
    sound: { loudness: whisper, clear: 足音が近づいてきた。, muffled: かすかな足音がした。 }
  whisper:
    witness: { clear: "{actor}が{target}に何かささやいた。" }
    target: { clear: "{actor}があなたに顔を寄せた。" }
    sound: { loudness: whisper, clear: "{actor}が「{speech}」とささやいた。", muffled: 誰かがささやく声がした。 }
    salience: background
  speak:
    witness: { clear: "{actor}が何か話している。" }
    sound: { loudness: normal, clear: "{actor}が「{speech}」と言った。", muffled: 誰かの話し声がした。 }
    salience: background
  shout:
    witness: { clear: "{actor}が叫んでいる。" }
    sound: { loudness: very_loud, clear: "{actor}が「{speech}」と叫んだ。", muffled: 遠くで誰かの叫び声がした。 }
    salience: notable
  listen:
    witness: { clear: "{actor}が耳を澄ましている。" }
    sound: null
    salience: background
  wait:
    witness: { clear: "{actor}はじっとしている。" }
    sound: null
    salience: background
  tend:
    witness: { clear: "{actor}が{target}を介抱している。" }
    target: { noticed_later: "{actor}が介抱してくれたようだ。" }
    sound: null
  hand_over:
    witness: { clear: "{actor}が{item}を{target}に渡した。" }
    target: { clear: "{actor}があなたに{item}を渡した。" }
    sound: null
  pick_up:
    witness: { clear: "{actor}が{item}を拾い上げた。" }
    sound: null
  drop:
    witness: { clear: "{actor}が{item}を地面に置いた。" }
    sound: { loudness: whisper, clear: 何かを置く音がした。, muffled: かすかな物音がした。 }
  search:
    witness: { clear: "{actor}が辺りを探っている。" }
    sound: { loudness: whisper, clear: 何かを探る物音がした。, muffled: かすかな物音がした。 }
  use_item:
    witness: { clear: "{actor}が{item}を使った。" }
    sound: null
  hold:
    witness: { clear: "{actor}が{item}を手に取った。" }
    sound: null
    salience: background
  put_away:
    witness: { clear: "{actor}が{item}を荷にしまった。" }
    sound: null
    salience: background
  cast_ballot:
    witness: { clear: "{actor}が票を入れた。" }
    sound: null
    salience: background

