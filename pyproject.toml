[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rpg-world"
version = "0.1.0"
description = "AI RPG World Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "coverage==7.9.2",
    "exceptiongroup==1.3.0",
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "iniconfig==2.1.0",
    "packaging==25.0",
    "pluggy==1.6.0",
    "Pygments==2.19.2",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "pytest-xdist==3.6.1",
    "PyYAML==6.0.1",
    "tomli==2.2.1",
    "typing_extensions==4.14.1",
    "litellm==1.83.0",
    "pydantic==2.8.2",
    "python-dotenv==1.0.1",
    "anyio>=4.0",
    "uvicorn[standard]==0.30.6",
]

[project.optional-dependencies]
export = [
    "datasets>=5.0.0",
    "pyarrow>=25.0.0",
]
dev = [
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# 既定のルールセットは 15,000 件以上を報告する。緑にできた分類だけを
# ここへ足し、CI を常に緑に保つ。分類を増やす PR と、違反を潰す PR は分ける。
select = ["E9", "F821"]
