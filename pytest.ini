[pytest]
# parametrize に空リストを渡したとき、既定では「1 件 skip」で終了コード 0 に
# なる。走査してパラメータを組む形のテストは、**走査が壊れて 0 件になっても
# 緑のまま通る**。検出器が静かに縮む形なので collection error にする
# (2026-08-11 に test_modules_import_standalone.py で実際に踏んだ)。
empty_parameter_set_mark = fail_at_collect
testpaths = tests
pythonpath =
    src
    .
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --ignore=tests_old
    -m "not quality"
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests
    quality: Quality-check scenarios for Issue #526 (manual run; dumps prompt to docs/quality_checks/)
