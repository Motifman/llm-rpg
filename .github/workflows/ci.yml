name: CI

on:
  push:
    # Unit of Work 再構築は複数の積み上げ PR を統合ブランチへ入れる。
    # 各 PR の検査に加え、マージ後の統合先端も main と同じ条件で再検証する。
    branches: [main, codex/uow-rearchitecture]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[export]"

      - name: Run tests
        run: pytest
