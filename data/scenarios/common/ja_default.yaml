  day: "Day {day}"
  late_night: "深夜 "
  late_night_before_hour: 6

choice_descriptions:
  travel_to: '指定した接続先へ移動を始める（経路は最短・通行条件を満たす必要がある）。移動しながら仲間へ報告・呼びかけをしたい場合は say_inline に一言を書ける。'
  set_sub_location: '今いる場所の中の区画 (籠など) に出入りする。'
  explore: '今いる場所を探す（何が見つかるかは世界による）。探しながら発見状況や方針を仲間へ伝えたい場合は say_inline に一言を書ける。'
  interact: '今いる場所の物・自分の持ち物・人に、操作を選んで働きかける。各操作には前提条件 (物の状態など) があり、満たさないと断られる (例: 一度取り尽くした場所をもう一度漁る / 既に開けた箱をまた開ける)。選べる対象と操作は【現在選べる対象引数】の interact.target と interact.how に、いまできない操作は「いまできない:」に理由とともに出る。操作が自分で書く値を求めるときは、【現在選べる対象引数】に「…を書く」と出るので、その値を details に書く。物を触りながら同じ場所の人へ短く声をかけたい場合は say_inline に一言を書ける。'
  wait: 'その場で待つ。気になる出来事が起きるか、しばらく経つまで、次の行動を選ばない。留まりながら仲間へ報告・相談・呼びかけをしたい場合は say_inline に一言を書ける。'
  speak: |-
    周りに向けて話す。reach で届け方を選ぶ:
    - ささやく: 同じ場所の 1 人 (to) にだけ中身が届く。同じ場所のほかの人には、ささやいたことだけが分かる
    - ふつうの声で話す: 同じ場所の人に中身が届く。隣の場所には、話し声がしたことだけが届く
    - 叫ぶ: 2 つ先の場所まで中身が届く
    このツールは発話だけに 1 回の行動を使う。同じ場所より遠くへ届かせたい (叫ぶ) / 1 人にだけ内密に伝えたい (ささやく) / 行動に添えるには長すぎる話をしたいときに使う。ふだんの報告・段取り・呼びかけは、何かの行動の say_inline に添える方が同じ時間で行動も進むため、そちらを優先する。
  use_item: '持ち物を使う（使い方が決まっている品物だけ）。例: 食べ物を食べて空腹を回復する、薬を飲んで HP を回復する。これは自分が使う行為で、相手には渡らない。同じ場所の相手に渡すには give_item を使う。使いながら同じ場所の人へ短く声をかけたい場合は say_inline に一言を書ける。'
  drop_item: '持ち物を今いる場所の地面に置く。同じ場所の人が pickup_item で拾える。協力のために素材を渡したい時、または持ち物を整理したい時に使う。地面に置いた品物は、その場所を離れても誰かが拾うまで残る (燃え尽きる品物は地面でも燃え尽きる)。置くところは同じ場所の人に見られる。置きながら同じ場所の人へ短く声をかけたい場合は say_inline に一言を書ける。'
  pickup_item: '今いる場所の地面に落ちている品物を拾い、荷に入れる。人が置いた素材を受け取ったり、初めから置いてある品物を手に入れたりする。荷がいっぱいだと拾えない。拾うところは同じ場所の人に見られる。拾いながら同じ場所の人へ短く声をかけたい場合は say_inline に一言を書ける。'
  give_item: '同じ場所にいる、倒れていない人へ持ち物を 1 つ直接渡す。素材の受け渡しだけでなく、飢えた相手へ食料を分ける、負傷した相手へ回復の品を渡す手段でもある。地面を経由せずに渡せるが、その場の人には渡したことが見られる。受け取る側の荷がいっぱいだと受け取れない。渡しながら報告・段取り・呼びかけをしたい場合は say_inline に一言を書ける。'
  tend_to_player: '同じ場所で倒れている (HP 0) 人を介抱して起こす。品物が無くても起こせ、HP は最大値の {revive_percent}% で戻る。倒れたまま {death_after}経つと死ぬ。疲れや空腹が高いだけで、まだ立って動ける相手には使えない。自分を起こすことはできない。介抱している様子は同じ場所の人に見られる。介抱しながら短く声をかけたい場合は say_inline に一言を書ける (例: 「大丈夫か！」)。'
  tend_to_player_without_tending: 'この世界では、倒れた人を介抱して起こすことはできない。'
  vote: '決めごとに 1 票を投じる。決めごとが開いている間だけ使える。最も多く票を集めた選び先に決まり、並んだときは決まらない。棄権できる決めごとでは棄権も 1 票として数え、棄権が最多なら決まらない。一度投じたら変えられない。投じる人が全員投じ終えた時点で集計される。'
  hold_item: '荷の中の品物を手に持つ。灯りは、手に持っているときだけ周りを照らす。手は 2 つで、ふさがっているときは先に持っていた品物を荷にしまう。'
  put_away_item: '手に持っている品物を荷にしまう。'
  duration_hours: "{hours} 時間ほど"
  duration_minutes: "{minutes} 分ほど"
  duration_turns: "{turns} ターンぶんほど"
  closing: 利用可能なツールから、次に取るべき 1 つの行動だけを選んでください。
  listing_note: '※ 行き先・人・品物・物は、【現在地と周囲】の "" の中の文字をそのまま引数に書く。'

